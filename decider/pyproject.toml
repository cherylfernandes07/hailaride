[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hailaride-decider"
version = "0.1.0"
description = "AI route decision microservice using Bedrock + Strands Agents"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "boto3>=1.34",
  "python-dotenv>=1.0",
  "strands-agents>=1.0",
  "mangum>=0.17"
]

[project.optional-dependencies]
decider = ["strands-decider>=0.2"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py310"
